<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FindMyDonor™ — National Live Blood Matching &amp; SOS Network</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#e02545" />
    <script>
      (function() {
        try {
          const originalFetch = window.fetch;
          if (originalFetch) {
            let customFetch = originalFetch;
            const desc = {
              get() { return customFetch; },
              set(val) { customFetch = val; },
              configurable: true,
              enumerable: true
            };
            Object.defineProperty(window, 'fetch', desc);
            if (typeof globalThis !== 'undefined') {
              Object.defineProperty(globalThis, 'fetch', desc);
            }
          }
        } catch (e) {
          console.warn("Unable to patch fetch setter:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
